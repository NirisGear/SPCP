[SPCP]

; Enables (1) or disables (0) Steam API requests.
EnablePlugin=1

; Steam application ID to query.
AppId=

;Changes game name on the overlay. Type "auto" to use the AppId game name.
Name=auto

; Delay between Steam API requests, in milliseconds.
RefreshIntervalMs=180000

; Delay between INI reloads, in milliseconds.
SettingsRefreshIntervalMs=5000

; Enables (1) or disables (0) logging.
EnableLog=1

; Full path to the log file.
LogPath=